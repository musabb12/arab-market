<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ciar VIP — سوق فاخر للمنتجات المميزة من حول العالم." />
    <title>Ciar VIP</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('ciar_defaults_version') !== '2') {
            localStorage.removeItem('i18nextLng')
            localStorage.removeItem('ciar_theme')
            localStorage.setItem('ciar_defaults_version', '2')
          }
          var stored = localStorage.getItem('ciar_theme')
          var theme = stored === 'dark' ? 'dark' : 'light'
          var root = document.documentElement
          if (theme === 'dark') {
            root.classList.add('dark')
            root.setAttribute('data-theme', 'dark')
          } else {
            root.classList.remove('dark')
            root.setAttribute('data-theme', 'light')
          }
          root.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
